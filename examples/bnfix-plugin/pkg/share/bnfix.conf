# bnfix 修复描述(定点补丁)
#
# 目标: 系统 OpenSSL 共享库 /usr/lib/libcrypto.so.1.0.0
# 位置: BN_mod_sqrt() 的 Tonelli-Shanks 内层循环
#       原代码只在 (i == e) 时报错退出; 但外循环会把 e 重写成上一轮的 i,
#       一旦 e 变成 1, 后一轮 i 从 2 起递增, 这个等值判断永远不成立 -> 死循环。
# 修法: 把该判断由 (e == i) 放宽为 (e <= i), 即 je -> jle:
#       合法输入下恒有 i <= e, 因此语义不变; 触发态下立刻走错误分支返回。
#       (等价于上游给该循环加上界的修复)
#
# 定位过程(详见仓库 README):
#   nm -D --defined-only libcrypto.so.1.0.0 | grep BN_mod_sqrt   -> 0xacc4b
#   反汇编该函数得到(文件偏移 == 虚拟地址, 因为该 LOAD 段 offset==vaddr):
#     ad221: incl 0x8(%rsp)          ; i++
#     ad225: cmp  0x8(%rsp),%ebx     ; 比较 e 与 i
#     ad229: je   0xad31c            ; 0f 84 ed 00 00 00   <- 目标字节在 0xad22a
#     ad31c: ... ERR_put_error(BN_R_NOT_A_SQUARE) ...
#
# 字段: offset(hex) 期望原字节(hex) 补丁后字节(hex)
LIB=/usr/lib/libcrypto.so.1.0.0
ORIG_MD5=0b65982b3ec6f87fccb2993b3407decf
PATCHED_MD5=9c79a8b10fb888035ba77910ffd27e65

# 条目之间用 ';' 分隔
PATCHES="0xad22a 84 8e"
