<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OpenSSL 修复 bnfix</title>
<!-- 界面用插件统一 UI 套件 ikui；资源由基础包提供，插件不带（见 references/ui.md） -->
<link rel="stylesheet" href="./ikui.css">
</head>
<body>

<script type="text/x-template" id="tpl">
<ik-page title="OpenSSL 修复" tag="bnfix" :sub="msg">
  <template #actions>
    <el-button size="small" @click="load">刷新</el-button>
  </template>

  <ik-tiles :items="tiles"></ik-tiles>

  <ik-sec title="操作">
    <div class="ik-toolbar">
      <el-button type="primary" @click="toggle(1)">启用修复</el-button>
      <el-button type="danger" plain @click="toggle(0)">撤销修复</el-button>
      <el-button @click="act('restart')">重启受影响服务</el-button>
      <el-button @click="act('verify')">快速自检</el-button>
      <el-button @click="act('verifyfull')">完整自检（回滚对比）</el-button>
    </div>
    <p class="ik-tip">
      <b>注意</b>：修复作用在系统共享库 <code class="ik-code">/usr/lib/libcrypto.so.1.0.0</code> 上，
      <b>已经在跑的进程仍持有旧库</b>，所以装完插件要「重启设备」才会对 openresty/ikdnsd 等真正生效；
      <b>根分区每次重启都会还原</b>，插件在每次开机时自动重新施加，卸载插件后重启即彻底失效。
    </p>
  </ik-sec>

  <ik-sec title="自检 / 诊断结果">
    <pre class="ik-pre">{{ out || '点上面的按钮查看结果…' }}</pre>
  </ik-sec>

  <ik-sec title="状态明细">
    <pre class="ik-pre">{{ dbg || '-' }}</pre>
  </ik-sec>
</ik-page>
</script>

<div id="app"></div>

<script src="./ikui.js"></script>
<script>
IKUI.mount('#app', {
  tpl: '#tpl',
  func: 'bnfix',
  data: function () {
    return { msg: '', tiles: [], out: '', dbg: '' };
  },
  methods: {
    pick: function (d, key) { return (d && d[key]) || (d && d.data && d.data[key]) || null; },
    load: function () {
      var self = this;
      return this.ik('show', { TYPE: 'data' }).then(function (d) {
        var s = self.pick(d, 'status') || d;
        var fixed = s.fixed === true || s.fixed === 'true';
        var en = String(s.enabled) === '1' || s.enabled === true;
        var users = Array.isArray(s.users) ? s.users : [];
        self.tiles = [
          { k: '修复状态', v: fixed ? '已生效于文件' : '未生效', tone: fixed ? 'ok' : 'warn' },
          { k: '开关', v: en ? '已启用' : '已关闭', tone: en ? 'ok' : 'err' },
          { k: '修复方式', v: s.mode === 'so' ? '整库覆盖' : '定点补丁' },
          { k: '库状态', v: s.lib_state || '-' },
          { k: '加载该库的进程', v: users.length ? users.join(', ') : '无', wide: true },
          { k: '记录条数', v: s.log_lines || 0, size: 'sm' }
        ];
        self.dbg = '目标库: ' + (s.lib || '-') +
          '\n当前 md5: ' + (s.md5 || '-') +
          '\n原始 md5: ' + (s.orig_md5 || '-') +
          '\n补丁后 md5: ' + (s.patched_md5 || '-') +
          '\n\n' + JSON.stringify(s, null, 2);
      }).catch(function (e) { self.msg = '加载失败: ' + e.message; });
    },
    toggle: function (v) {
      var self = this;
      this.ik('seting', { key: 'enabled', value: String(v) }).then(function () {
        IKUI.toast(v ? '已启用修复（重启设备后对所有服务生效）' : '已撤销修复（重启设备后彻底失效）', 'success');
        self.load();
      }).catch(function (e) { IKUI.toast('操作失败: ' + e.message, 'error'); });
    },
    act: function (action) {
      var self = this;
      this.out = '执行中…';
      this.ik(action, {}).then(function (d) {
        var v = self.pick(d, (action === 'verify' || action === 'verifyfull') ? 'verify' : action);
        if (action === 'restart') {
          IKUI.toast('已尝试重启受影响的服务', 'success');
          self.out = '';
          self.load();
          return;
        }
        self.out = JSON.stringify(v || d, null, 2);
        if (v && v.pass === true) { IKUI.toast('自检通过', 'success'); }
        else if (v && v.pass === false) { IKUI.toast('自检未通过', 'error'); }
        self.load();
      }).catch(function (e) {
        self.out = '失败: ' + e.message;
        IKUI.toast('操作失败: ' + e.message, 'error');
      });
    }
  },
  mounted: function () {
    var self = this;
    this.load();
    this.timer = setInterval(function () { if (!document.hidden) { self.load(); } }, 30000);
  },
  unmounted: function () { if (this.timer) { clearInterval(this.timer); } }
});
</script>
</body>
</html>
