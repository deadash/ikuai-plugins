<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>插件在线升级 ikupd</title>
<!-- 界面用插件统一 UI 套件 ikui；资源由基础包提供，插件不带（见 references/ui.md） -->
<link rel="stylesheet" href="./ikui.css">
</head>
<body>

<script type="text/x-template" id="tpl">
<ik-page title="插件在线升级" tag="ikupd" :sub="msg">
  <template #actions>
    <el-tag :type="proxyOn ? 'success' : 'info'" size="small" effect="plain">
      {{ proxyOn ? '代理已启用' : '直连' }}
    </el-tag>
    <el-tag :type="staged.count > 0 ? 'warning' : 'info'" size="small" effect="plain">
      暂存 {{ staged.count || 0 }} 个包{{ staged.size > 0 ? '（' + fmtSize(staged.size) + '）' : '' }}
    </el-tag>
    <el-button size="small" type="primary" :loading="busy" @click="act('check', {}, '检查完成')">检查更新</el-button>
    <el-button size="small" @click="load">刷新</el-button>
  </template>

  <ik-sec title="代理">
    <div class="ik-toolbar">
      <el-switch v-model="proxyOn" @change="toggleProxy"></el-switch>
      <span class="ik-mut" style="font-size:12px">
        {{ proxyOn ? ('已启用 ' + (proxy.url || '(未填地址)')) : '未启用（直连）' }}
      </span>
    </div>
    <div class="ik-toolbar" style="margin-top:10px">
      <el-input v-model="proxy.url" style="width:360px"
                placeholder="socks5h://192.168.1.100:1080 或 http://192.168.1.100:1080"></el-input>
      <el-button @click="saveProxyUrl">保存地址</el-button>
      <el-input v-model="proxy.token" style="width:320px" :placeholder="tokenPlaceholder"></el-input>
      <el-button @click="saveToken">保存 Token</el-button>
    </div>
    <p class="ik-tip">启用后 API 请求与插件包下载都走该地址；关闭则直连。</p>
  </ik-sec>

  <ik-sec title="仓库列表">
    <div class="ik-toolbar">
      <el-input v-model="newRepo.url" style="width:380px"
                placeholder="https://github.com/deadash/ikuai-plugins/releases"></el-input>
      <el-input v-model="newRepo.desc" style="width:200px" placeholder="说明(可空)"></el-input>
      <el-button type="primary" @click="addRepo">添加</el-button>
    </div>
    <p class="ik-tip">
      只识别 github.com/用户/仓库；写成 <code class="ik-code">.../releases</code> 取最新版，
      写成 <code class="ik-code">.../releases/tag/&lt;标签&gt;</code> 取指定版本。
      地址里不能带 <code class="ik-code">?</code> <code class="ik-code">&amp;</code>
      <code class="ik-code">=</code> 等字符（设备的 Web 接口会拒绝）。
    </p>
    <el-table :data="repos" border size="small" style="width:100%">
      <el-table-column label="仓库" min-width="320">
        <template #default="{ row }">
          <div>{{ row.url }}</div>
          <div class="ik-mut" style="font-size:12px">{{ row.desc || '(无说明)' }}</div>
          <el-collapse v-if="notesOf(row.slug)" style="margin-top:4px">
            <el-collapse-item title="发布说明" :name="row.slug">
              <pre class="ik-pre" style="max-height:200px">{{ notesOf(row.slug) }}</pre>
            </el-collapse-item>
          </el-collapse>
        </template>
      </el-table-column>
      <el-table-column label="最新版本" min-width="180">
        <template #default="{ row }">
          <el-tag v-if="row.error" type="danger" size="small" effect="plain">{{ shortErr(row.error) }}</el-tag>
          <span v-else-if="row.tag" style="font-family:var(--ik-mono)">{{ row.tag }}</span>
          <span v-else class="ik-mut">未检查</span>
          <div class="ik-mut" style="font-size:12px">
            {{ row.when ? fmtWhen(row.when) : '' }}{{ row.at ? ' · 检查于 ' + row.at : '' }}
          </div>
        </template>
      </el-table-column>
      <el-table-column label="操作" width="90">
        <template #default="{ row }">
          <el-button size="small" type="danger" plain @click="delRepo(row)">删除</el-button>
        </template>
      </el-table-column>
    </el-table>
  </ik-sec>

  <ik-sec title="可用更新">
    <el-table :data="assets" border size="small" style="width:100%" row-key="name">
      <el-table-column type="expand">
        <template #default="{ row }">
          <div v-if="row.downloaded" style="font-size:12px;line-height:1.9">
            包内 Release: plugin={{ row.pkg_plugin || '-' }} version={{ row.pkg_version || '-' }}
            <span v-if="row.pkg_comment"> comment={{ row.pkg_comment }}</span><br>
            sha256 校验通过 · 下载于 {{ row.pkg_time || '-' }}
            <span v-if="row.pkg_manifest === '1'"> · 包内含 MANIFEST</span>
            <div v-if="row.note" class="ik-err">{{ row.note }}</div>
          </div>
          <div v-else style="font-size:12px;line-height:1.9">
            仓库: {{ row.repo }}
            <div v-if="row.note" class="ik-warn">{{ row.note }}</div>
          </div>
        </template>
      </el-table-column>
      <el-table-column label="插件" min-width="200">
        <template #default="{ row }">
          <span style="font-family:var(--ik-mono)">{{ row.plugin }}</span>
          <div class="ik-mut" style="font-size:12px">{{ row.name }}</div>
        </template>
      </el-table-column>
      <el-table-column label="远端版本" width="110">
        <template #default="{ row }">{{ row.remote_ver || '-' }}</template>
      </el-table-column>
      <el-table-column label="本地版本" width="110">
        <template #default="{ row }">{{ row.local_ver || '未安装' }}</template>
      </el-table-column>
      <el-table-column label="状态" width="110">
        <template #default="{ row }">
          <el-tag :type="stateType(row.state)" size="small" effect="plain">{{ stateText(row.state) }}</el-tag>
        </template>
      </el-table-column>
      <el-table-column label="大小" width="100">
        <template #default="{ row }">{{ fmtSize(row.size) }}</template>
      </el-table-column>
      <el-table-column label="sha256" width="150">
        <template #default="{ row }">
          <span style="font-family:var(--ik-mono);font-size:12px">
            {{ row.sha256 ? row.sha256.slice(0, 16) : '资源未提供' }}
          </span>
        </template>
      </el-table-column>
      <el-table-column label="操作" width="170">
        <template #default="{ row }">
          <template v-if="row.downloaded">
            <el-button size="small" type="primary" @click="doInstall(row)">安装</el-button>
            <el-button size="small" @click="doDiscard(row)">丢弃</el-button>
          </template>
          <el-button v-else size="small" type="primary" plain @click="doDownload(row)">
            {{ (row.state === 'current' || row.state === 'same') ? '重新下载' : '下载' }}
          </el-button>
        </template>
      </el-table-column>
    </el-table>
    <p class="ik-tip">
      只列出 Release 里的 <code class="ik-code">.zip</code> 资源（自动排除 GitHub 生成的 Source code 包）；
      插件名按文件名前缀匹配（<code class="ik-code">插件名-v版本-plugin.zip</code>）；
      是否更新由资源自带的 sha256 与本地已安装包的 sha256 比对得出。
    </p>
  </ik-sec>

  <el-collapse>
    <el-collapse-item title="日志（最近 12 条）" name="log">
      <pre class="ik-pre">{{ logs.length ? logs.join('\n') : '(暂无日志)' }}</pre>
    </el-collapse-item>
  </el-collapse>
</ik-page>
</script>

<div id="app"></div>

<script src="./ikui.js"></script>
<script>
IKUI.mount('#app', {
  tpl: '#tpl',
  func: 'ikupd',
  data: function () {
    return {
      msg: '', busy: false,
      proxy: { enabled: '0', url: '', token: '' },
      proxyOn: false, proxySaved: '',
      staged: {}, repos: [], assets: [], logs: [], releaseNotes: {},
      newRepo: { url: '', desc: '' },
      tokenPlaceholder: 'GitHub Token(可选, 避免匿名限流 60 次/小时)'
    };
  },
  computed: {
    proxyOn_: function () { return String(this.proxy.enabled) === '1'; }
  },
  methods: {
    fmtSize: function (n) {
      n = parseInt(n, 10) || 0;
      if (n >= 1048576) { return (n / 1048576).toFixed(2) + ' MB'; }
      if (n >= 1024) { return (n / 1024).toFixed(1) + ' KB'; }
      return n + ' B';
    },
    fmtWhen: function (s) { return s ? String(s).replace('T', ' ').replace('Z', '') : ''; },
    shortErr: function (s) { return s && s.length > 40 ? s.slice(0, 40) + '…' : s; },
    notesOf: function (slug) { return this.releaseNotes[slug] || ''; },
    stateText: function (st) {
      return st === 'new' ? '新插件' : (st === 'update' ? '可更新'
        : (st === 'same' ? '版本相同' : '已是最新'));
    },
    stateType: function (st) {
      return st === 'new' ? 'success' : (st === 'update' ? 'warning'
        : (st === 'same' ? 'info' : ''));
    },
    load: function () {
      var self = this;
      return this.ik('show', { TYPE: 'data' }).then(function (d) {
        if (d && d.error) { self.msg = d.error; return; }
        /* 后端 show 用 json_append 追加在 "data" 键下, 这里拆一层 */
        if (d && typeof d === 'object' && d.proxy === undefined && d.data !== undefined) { d = d.data; }
        var p = d.proxy || {};
        self.proxy = { enabled: String(p.enabled || '0'), url: p.url || '', token: '' };
        self.proxySaved = p.url || '';
        self.proxyOn = String(p.enabled) === '1';
        self.tokenPlaceholder = String(p.token) === '1'
          ? 'GitHub Token 已设置（留空保存=不改，填 - 保存=清除）'
          : 'GitHub Token(可选, 避免匿名限流 60 次/小时)';
        self.staged = d.staged || {};
        self.repos = d.repos || [];
        self.assets = d.assets || [];
        self.logs = d.log || [];
        self.releaseNotes = d.release_notes || {};
      }).catch(function (e) { self.msg = '读取状态失败: ' + e.message; });
    },
    act: function (action, param, okText) {
      var self = this;
      this.busy = true;
      return this.ik(action, param || {}).then(function () {
        IKUI.toast(okText || '操作完成', 'success');
        return self.load();
      }).catch(function (e) {
        IKUI.toast((okText ? okText + ' 失败: ' : '') + e.message, 'error');
      }).then(function () { self.busy = false; });
    },
    /* 请求参数不能含空格: 说明里的空格编码成 +, 后端 tr '+' ' ' 还原 */
    enc: function (s) { return String(s || '').replace(/ /g, '+'); },

    /* ---------------------------------------------------------- 代理 */
    toggleProxy: function () {
      var self = this;
      var on = this.proxyOn;                 /* el-switch 已经把值改过来了 */
      var url = String(this.proxy.url || '').trim();
      var go = function () {
        self.ik('seting', { key: 'proxy', value: on ? '1' : '0' }).then(function () {
          IKUI.toast(on ? '已启用代理' : '已关闭代理', 'success');
          self.load();
        }).catch(function (e) { IKUI.toast(e.message, 'error'); });
      };
      /* 先保存地址再启用, 避免"启用了但没地址" */
      if (on && url && url !== this.proxySaved) {
        this.ik('seting', { key: 'proxy_url', value: url }).then(function () {
          self.proxySaved = url;
          go();
        }).catch(function (e) { IKUI.toast('代理地址保存失败: ' + e.message, 'error'); });
        return;
      }
      go();
    },
    saveProxyUrl: function () {
      var self = this;
      var url = String(this.proxy.url || '').trim();
      this.proxySaved = url;
      this.act('seting', { key: 'proxy_url', value: url }, '已保存代理地址');
    },
    saveToken: function () {
      var v = String(this.proxy.token || '').trim();
      if (v === '-' || v === '0') { v = ''; }   /* 输 - 表示清除 */
      var self = this;
      this.act('seting', { key: 'token', value: v }, v ? '已保存 Token' : '已清除 Token')
        .then(function () { self.proxy.token = ''; });
    },

    /* ---------------------------------------------------------- 仓库 */
    addRepo: function () {
      var url = String(this.newRepo.url || '').trim();
      if (!url) { IKUI.toast('请先填仓库地址', 'warning'); return; }
      var self = this;
      this.act('repo_add', { url: url, desc: this.enc(this.newRepo.desc) }, '已添加仓库')
        .then(function () { self.newRepo.url = ''; self.newRepo.desc = ''; });
    },
    delRepo: function (row) {
      var self = this;
      IKUI.confirm('从列表中删除该仓库?\n\n' + row.url).then(function (yes) {
        if (yes) { self.act('repo_del', { url: row.url }, '已删除仓库'); }
      });
    },

    /* ---------------------------------------------------------- 下载 / 安装 */
    /* 用户同意后才下载 */
    doDownload: function (a) {
      var self = this;
      var lines = ['确认下载这个插件包?', '',
        '插件: ' + a.plugin,
        '远端版本: ' + (a.remote_ver || '-'),
        '本地版本: ' + (a.local_ver || '未安装'),
        '大小: ' + this.fmtSize(a.size),
        'sha256: ' + (a.sha256 ? a.sha256.slice(0, 16) + '…' : '(资源未提供, 下载后仍会计算)'),
        '', '下载完还需要再确认一次才会安装。'];
      IKUI.confirm(lines.join('\n'), '下载确认').then(function (yes) {
        if (yes) { self.act('download', { slug: a.slug, name: a.name }, '已下载并校验: ' + a.name); }
      });
    },
    /* 用户同意后才安装 */
    doInstall: function (a) {
      var self = this;
      var t = '确认安装 / 更新?\n\n插件: ' + (a.pkg_plugin || a.plugin) +
        '\n版本: ' + (a.pkg_version || a.remote_ver || '-') +
        '\n本地版本: ' + (a.local_ver || '未安装') +
        '\n\n安装后会立刻生效(插件自身的配置与数据会保留)。';
      IKUI.confirm(t, '安装确认').then(function (yes) {
        if (yes) { self.act('install', { name: a.name }, '安装完成: ' + (a.pkg_plugin || a.plugin)); }
      });
    },
    doDiscard: function (a) {
      var self = this;
      IKUI.confirm('丢弃已下载的包?\n\n' + a.name).then(function (yes) {
        if (yes) { self.act('discard', { name: a.name }, '已丢弃: ' + a.name); }
      });
    }
  },
  mounted: function () { this.load(); }
});
</script>
</body>
</html>
