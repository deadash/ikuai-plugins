<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>广告拦截</title>
<!-- 界面用插件统一 UI 套件 ikui；资源由基础包提供，插件不带（见 references/ui.md） -->
<link rel="stylesheet" href="./ikui.css">
</head>
<body>

<script type="text/x-template" id="tpl">
<ik-page title="广告拦截" tag="ikadblock">
  <template #actions>
    <el-tag :type="enabled ? 'success' : 'info'" size="small" effect="plain">
      {{ enabled ? '已启用' : '已停用' }}
    </el-tag>
    <el-tag :type="running ? 'success' : 'danger'" size="small" effect="plain">
      {{ running ? '守护中' : '守护未运行' }}
    </el-tag>
    <span class="ik-msg">{{ msg }}</span>
    <span class="ik-mut" style="font-size:12px">启用</span>
    <el-switch v-model="enabled" @change="toggle"></el-switch>
    <el-button size="small" @click="load">刷新</el-button>
  </template>

  <ik-sec title="运行状态">
    <ik-tiles :items="tiles"></ik-tiles>
    <el-descriptions :column="3" border size="small" style="margin-top:12px">
      <el-descriptions-item label="上游 DNS">{{ s.upstream || '设备默认' }}</el-descriptions-item>
      <el-descriptions-item label="上游转发 / 缓存计数">
        {{ (s.total_miss || 0) + ' / ' + (s.total_cache || 0) }}
      </el-descriptions-item>
      <el-descriptions-item label="规则更新时间">{{ fmtTime(s.last_update) }}</el-descriptions-item>
      <el-descriptions-item label="拦截接口">
        {{ s.ifaces || '(暂无 LAN 接口, 守护进程会重试)' }}
      </el-descriptions-item>
      <el-descriptions-item label="IPv6(AAAA)">{{ s.ipv6 ? '同时拦截' : '仅 IPv4' }}</el-descriptions-item>
      <el-descriptions-item label="守护进程 / 自动更新">
        {{ (s.daemon ? '守护中' : '守护未运行') + ' / 自动更新' + (String(s.auto_update) === '1' ? '已开' : '已关') }}
      </el-descriptions-item>
    </el-descriptions>
    <p class="ik-tip">
      统计来自设备自带 DNS 转发器每 60 秒写的报表（实例重启会归零，插件按增量累加）。
      被 sinkhole 拦下的查询不会转发上游，所以「本地应答 = 查询总数 − 上游转发」，
      它包含拦截命中与缓存命中两部分 —— 转发器只给聚合计数，分不出两者的比例。
    </p>
  </ik-sec>

  <ik-sec title="规则库">
    <p class="ik-tip">
      内置种子表离线即可拦截常见广告/跟踪域名；点「更新规则库」会从开源项目拉取完整列表
      （anti-AD、StevenBlack、1Hosts Lite）并合并去重，源可在
      <code class="ik-code">data/sources.conf</code> 里增删。
    </p>
    <div class="ik-toolbar">
      <el-button type="primary" :loading="busy" @click="act('update', {}, '规则库更新完成')">更新规则库</el-button>
      <el-button :loading="busy" @click="act('rebuild', {}, '已重新建表')">重新建表</el-button>
      <el-button :loading="busy" @click="doVerify">立即自检</el-button>
      <span class="ik-mut" style="font-size:12px">源 {{ s.sources || 0 }} 个</span>
    </div>
    <pre v-if="verifyOut" class="ik-pre" style="margin-top:10px">{{ verifyOut }}</pre>
  </ik-sec>

  <ik-sec title="自定义拦截">
    <div class="ik-toolbar">
      <el-input v-model="newCustom" style="width:340px"
                placeholder="例: ads.example.com(自动含全部子域)" @keyup.enter="addDomain"></el-input>
      <el-button @click="addDomain">加入拦截</el-button>
    </div>
    <div class="ik-toolbar" style="margin-top:12px">
      <el-tag v-for="d in custom" :key="d" closable type="danger" effect="plain"
              @close="removeDomain(d, 'del')">{{ d }}</el-tag>
      <span v-if="!custom.length" class="ik-mut" style="font-size:12px">(空)</span>
    </div>
  </ik-sec>

  <ik-sec title="白名单（不拦截）">
    <div class="ik-toolbar">
      <el-input v-model="newWhite" style="width:340px"
                placeholder="例: s.click.taobao.com" @keyup.enter="addWhite"></el-input>
      <el-button @click="addWhite">加入白名单</el-button>
    </div>
    <p class="ik-tip">
      白名单语义：加入 <code class="ik-code">good.example.com</code> 后，它<b>及它的所有子域</b>都不再拦截，
      规则库里单独列出的子域条目也一并让开；同时它的<b>父域条目</b>（<code class="ik-code">example.com</code>）
      也会让开 —— 因为拦截是父域通配的，不让开的话白名单就无从生效。
    </p>
    <div class="ik-toolbar">
      <el-tag v-for="d in whitelist" :key="d" closable type="success" effect="plain"
              @close="removeDomain(d, 'whitedel')">{{ d }}</el-tag>
      <span v-if="!whitelist.length" class="ik-mut" style="font-size:12px">(空)</span>
    </div>
  </ik-sec>

  <ik-sec :title="'最近日志 ' + logPath">
    <pre class="ik-pre">{{ logs.length ? logs.join('\n') : '(暂无日志)' }}</pre>
  </ik-sec>

  <el-collapse>
    <el-collapse-item title="工作原理与接口说明" name="how">
      <div class="ik-tip">
        <p><b>1) DNS sinkhole</b>：插件用设备自带的 DNS 转发器 <code class="ik-code">ikdnsx</code> 跑一个独立实例
        （监听 5353），静态表里对每个拦截域名写 <code class="ik-code">ipv4 *.域名 0.0.0.0</code> /
        <code class="ik-code">ipv6 *.域名 ::</code> —— 一条通配即覆盖该域名及其任意层级子域。</p>
        <p><b>2) 全网 DNS 纳管</b>：用 iptables nat 把 LAN 侧所有 UDP/53 查询 REDIRECT 到这个实例
        （与 iKuai 自带 DNS 代理同一套路，我们的链在最前面），所以客户端即使自己指定
        8.8.8.8/114.114.114.114 也绕不过去。</p>
        <p><b>3) 其余域名照常解析</b>：该实例同时是转发器，非拦截域名按设备
        <code class="ik-code">/etc/resolv.conf</code> 里的上游正常解析。</p>
        <p><b>4) 安全兜底</b>：守护进程 + 每分钟的定时守卫负责"进程/规则被冲掉后自动补回"；
        一旦实例起不来会主动撤掉劫持规则（fail-open），不会把 DNS 弄挂。卸载插件后立即恢复原状。</p>
        <p><b>局限</b>：只处理 DNS；客户端走 DoH/DoT、或广告与业务同域（如某些应用的自家 CDN）
        时拦不住；也不做 HTTPS 证书级拦截。</p>
      </div>
    </el-collapse-item>
  </el-collapse>
</ik-page>
</script>

<div id="app"></div>

<script src="./ikui.js"></script>
<script>
IKUI.mount('#app', {
  tpl: '#tpl',
  func: 'ikadblock',
  data: function () {
    return {
      msg: '', s: {}, tiles: [], custom: [], whitelist: [], logs: [],
      enabled: true, running: false, busy: false,
      newCustom: '', newWhite: '', verifyOut: '', logPath: ''
    };
  },
  methods: {
    fmtTime: function (sec) {
      sec = parseInt(sec, 10) || 0;
      if (sec <= 0) { return '内置种子表（尚未联网更新）'; }
      var d = new Date(sec * 1000);
      var p = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
        p(d.getHours()) + ':' + p(d.getMinutes());
    },
    load: function () {
      var self = this;
      return this.ik('show', { TYPE: 'data' }).then(function (d) {
        var s = d.status || d || {};
        self.s = s;
        var on = String(s.enabled) === '1' || s.enabled === true;
        self.enabled = on;
        self.running = !!s.daemon;
        self.tiles = [
          { k: '拦截域名', v: s.domains !== undefined ? s.domains : '—' },
          { k: '本地应答（缓存或拦截）', v: s.local !== undefined ? s.local : '—', size: 'sm' },
          { k: 'DNS 查询总数', v: s.total_query !== undefined ? s.total_query : '—' },
          { k: '本地应答占比', v: (s.hit !== undefined ? s.hit : '0.0') + '%' },
          { k: '劫持规则（接口）', v: s.rules !== undefined ? s.rules : '—', size: 'sm' },
          { k: '规则库条目', v: s.downloaded !== undefined ? s.downloaded : '—', size: 'sm' }
        ];
        self.custom = d.custom || [];
        self.whitelist = d.whitelist || [];
        self.logs = d.logs || [];
        self.logPath = s.log_path || '';
      }).catch(function (e) { self.msg = '读取状态失败: ' + e.message; });
    },
    act: function (action, param, okText) {
      var self = this;
      this.busy = true;
      return this.ik(action, param || {}).then(function (d) {
        self.msg = okText || '操作完成';
        self.load();
        return d;
      }).catch(function (e) { self.msg = e.message; })
        .then(function () { self.busy = false; });
    },
    doVerify: function () {
      var self = this;
      this.act('verify', { TYPE: 'data' }, '自检完成').then(function (d) {
        if (d && d.verify) { self.verifyOut = JSON.stringify(d.verify, null, 2); }
      });
    },
    toggle: function (v) {
      this.act('seting', { key: 'enabled', value: v ? '1' : '0' },
        v ? '已开启广告拦截' : '已关闭广告拦截');
    },
    addDomain: function () {
      var v = String(this.newCustom || '').trim();
      if (!v) { return; }
      var self = this;
      this.act('add', { domain: v }, '已加入拦截: ' + v).then(function () { self.newCustom = ''; });
    },
    addWhite: function () {
      var v = String(this.newWhite || '').trim();
      if (!v) { return; }
      var self = this;
      this.act('whiteadd', { domain: v }, '已加入白名单: ' + v).then(function () { self.newWhite = ''; });
    },
    removeDomain: function (d, action) {
      var self = this;
      this.ik(action, { domain: d }).then(function () {
        self.msg = '已删除 ' + d;
        self.load();
      }).catch(function (e) { self.msg = e.message; });
    }
  },
  mounted: function () { this.load(); }
});
</script>
</body>
</html>
