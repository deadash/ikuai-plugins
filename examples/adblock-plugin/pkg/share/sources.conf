# ikadblock 规则源(每行: 名称|URL|格式), 格式目前统一自动识别:
#   纯域名表 / hosts 表(0.0.0.0 域名) / dnsmasq(address=/域名/) / adblock(||域名^)
# 顺序即优先级: 合并去重后如果超过 MAX_DOMAINS(默认 120000) 条, 先砍后面的源。
# 想关掉某个源就把它注释掉(行首加 #)。
# 说明: 国内网络直连 raw.githubusercontent.com / *.github.io 基本不通, 所以
#       GitHub 上的规则库统一走 ghproxy.net 镜像; 如果你的设备能直连, 可自行改回。
anti-ad|https://anti-ad.net/domains.txt|auto
stevenblack|https://ghproxy.net/https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts|auto
# 1hosts-lite 与 stevenblack 重叠较多, 默认关掉(容量/时间换不来多少新域名)
#1hosts-lite|https://ghproxy.net/https://raw.githubusercontent.com/badmojr/1Hosts/master/Lite/hosts.txt|auto
