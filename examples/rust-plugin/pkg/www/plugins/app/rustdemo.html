<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Rust 示例插件 rustdemo</title>
<!-- 界面用插件统一 UI 套件 ikui；资源由基础包提供，插件不带（见 references/ui.md） -->
<link rel="stylesheet" href="./ikui.css">
</head>
<body>

<script type="text/x-template" id="tpl">
<ik-page title="Rust 示例插件" tag="rustdemo" :sub="msg">
  <template #actions>
    <el-button size="small" @click="load">刷新</el-button>
  </template>

  <ik-tiles :items="tiles"></ik-tiles>

  <ik-sec title="采集配置" desc="保存在插件自己的数据库里，重启不丢">
    <el-form label-width="110px" @submit.prevent>
      <el-form-item label="采集间隔">
        <el-input v-model="cfg.interval" type="number" style="width:180px">
          <template #append>秒</template>
        </el-input>
      </el-form-item>
      <el-form-item label="保留条数">
        <el-input v-model="cfg.retention" type="number" style="width:180px"></el-input>
      </el-form-item>
      <el-form-item label="备注">
        <el-input v-model="cfg.note" style="width:320px" placeholder="例如: 机房A 出口路由"></el-input>
      </el-form-item>
      <el-form-item>
        <el-button type="primary" @click="save">保存配置</el-button>
        <el-button @click="act('sample')">立即采样</el-button>
        <el-button type="danger" plain @click="act('clear')">清空采样数据</el-button>
      </el-form-item>
    </el-form>
  </ik-sec>

  <ik-sec title="最近采集记录" desc="最多 20 条">
    <el-table :data="rows" border size="small" style="width:100%">
      <el-table-column label="时间" min-width="160">
        <template #default="{ row }">{{ fmtTime(row.ts) }}</template>
      </el-table-column>
      <el-table-column label="uptime(s)" width="110">
        <template #default="{ row }">{{ row.uptime || 0 }}</template>
      </el-table-column>
      <el-table-column label="load1" width="90">
        <template #default="{ row }">{{ row.load1 || 0 }}</template>
      </el-table-column>
      <el-table-column label="可用内存(MB)" width="130">
        <template #default="{ row }">{{ ((Number(row.mem_available_kb) || 0) / 1024).toFixed(1) }}</template>
      </el-table-column>
      <el-table-column label="连接跟踪数" width="110">
        <template #default="{ row }">{{ row.conntrack || 0 }}</template>
      </el-table-column>
    </el-table>
  </ik-sec>

  <ik-sec title="数据库文件">
    <pre class="ik-pre">{{ dbinfo || '-' }}</pre>
    <p class="ik-tip">
      这个插件演示了插件系统的完整能力：<b>安装/卸载/开机自启</b>（install.sh / boot.sh / uninstall.sh）、
      <b>前端设置页</b>（www/ 目录 + function/ 后端接口）、<b>持久化与数据库</b>
      （redb 嵌入式数据库，存放于 <code class="ik-code">/etc/mnt/plugins/rustdemo/data/rustdemo.redb</code>，重启不丢）。
      源代码见 <code class="ik-code">examples/rust-plugin/</code>。
    </p>
  </ik-sec>
</ik-page>
</script>

<div id="app"></div>

<script src="./ikui.js"></script>
<script>
IKUI.mount('#app', {
  tpl: '#tpl',
  func: 'rustdemo',
  data: function () {
    return {
      msg: '', tiles: [], rows: [], dbinfo: '',
      cfg: { interval: '', retention: '', note: '' }
    };
  },
  methods: {
    fmtSize: function (n) {
      n = Number(n) || 0;
      if (n > 1048576) { return (n / 1048576).toFixed(2) + ' MB'; }
      if (n > 1024) { return (n / 1024).toFixed(1) + ' KB'; }
      return n + ' B';
    },
    fmtTime: function (ts) {
      if (!ts) { return '-'; }
      var d = new Date(Number(ts) * 1000);
      function p(x) { return (x < 10 ? '0' : '') + x; }
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
        p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    },
    load: function () {
      var self = this;
      return this.ik('show', { TYPE: 'data' }).then(function (d) {
        /* 兼容两种返回: Data.{stats,config,samples} 或 Data.data.{...} */
        if (d && d.data && !d.stats) { d = d.data; }
        if (d && d.error) { self.msg = d.error; }
        var s = d.stats || {}, c = d.config || {};
        var samples = Array.isArray(d.samples) ? d.samples : [];
        self.tiles = [
          { k: '采样记录数', v: (s.samples || 0) + ' 条' },
          { k: '数据库大小', v: self.fmtSize(s.db_size), size: 'sm' },
          { k: '最后采集', v: s.last ? self.fmtTime(s.last.ts) : '无', size: 'sm' },
          { k: '守护进程', v: s.daemon_running ? ('运行中 #' + s.daemon_pid) : '未运行',
            tone: s.daemon_running ? 'ok' : 'err' },
          { k: '采集间隔', v: (c.interval || '-') + ' 秒', size: 'sm' },
          { k: '保留条数', v: c.retention || '-', size: 'sm' }
        ];
        self.cfg.interval = c.interval || '';
        self.cfg.retention = c.retention || '';
        self.cfg.note = c.note || '';
        self.rows = samples.slice().reverse();
        self.dbinfo = '数据库: ' + (s.db_path || '-') + '\n大小: ' + self.fmtSize(s.db_size) +
          '\n创建时间: ' + self.fmtTime(s.created_at) +
          '\n守护进程 PID: ' + (s.daemon_pid || '-') + '\n日志: /etc/log/ikguard/rustdemo.log';
      }).catch(function (e) { self.msg = '加载失败: ' + e.message; });
    },
    save: function () {
      var self = this;
      /* 参数里不能带空格, 备注用 '+' 代替空格(后端会还原) */
      var note = String(this.cfg.note || '').replace(/\s+/g, '+');
      this.ik('seting', { key: 'interval', value: String(this.cfg.interval || '') })
        .then(function () { return self.ik('seting', { key: 'retention', value: String(self.cfg.retention || '') }); })
        .then(function () { return self.ik('seting', { key: 'note', value: note || '+' }); })
        .then(function () { IKUI.toast('配置已保存（存在插件数据库里）', 'success'); self.load(); })
        .catch(function (e) { IKUI.toast('保存失败: ' + e.message, 'error'); });
    },
    act: function (action) {
      var self = this;
      this.ik(action, {}).then(function () {
        IKUI.toast('操作成功', 'success'); self.load();
      }).catch(function (e) { IKUI.toast('操作失败: ' + e.message, 'error'); });
    }
  },
  mounted: function () {
    var self = this;
    this.load();
    this.timer = setInterval(function () { if (!document.hidden) { self.load(); } }, 20000);
  },
  unmounted: function () { if (this.timer) { clearInterval(this.timer); } }
});
</script>
</body>
</html>
