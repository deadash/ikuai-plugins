<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>启用插件功能</title>
<!-- 统一 UI 套件由基础包提供（/plugins/app/ikui.js，开机软链自 /etc/mnt/.boot/www/ui/），
     插件和基础包自己的页面都用同一份，不各自带。 -->
<link rel="stylesheet" href="./ikui.css">
<style>
  /* 这页是"居中一张卡"，不是常规插件页，所以不用 ik-page，自己居中 */
  html, body { height: 100%; }
  body { background: var(--ik-bg); display: flex; align-items: center; justify-content: center; }
  .wrap { width: min(560px, 92vw); }
  .hd { text-align: center; padding-top: 6px; }
  .hd img { width: 56px; height: 56px; }
  .hd h2 { margin: 12px 0 0; font-size: 17px; }
  .foot { display: flex; align-items: center; gap: 10px; padding-top: 4px; }
</style>
</head>
<body>

<script type="text/x-template" id="tpl">
  <div class="wrap">
    <el-card shadow="never" body-style="padding:26px 28px">
      <div class="hd">
        <img src="/plugins/app/terms.png" alt="terms">
        <h2>启用插件功能</h2>
      </div>

      <el-alert type="warning" :closable="false" show-icon style="margin:16px 0 18px">
        <template #title>
          <div style="line-height:1.9;text-align:left">
            本框架与插件由第三方提供，并非爱快官方产品，安装后可能影响设备稳定性与官方支持资格。<br>
            <b>首次启用前需要阅读并同意《使用条款与免责声明》</b>；同意记录只保存在本设备
            (<code class="ik-code">/etc/mnt/plugins/.eula</code>)，此后不再重复询问。
          </div>
        </template>
      </el-alert>

      <div class="foot">
        <el-button type="primary" style="flex:1" @click="openDlg">查看并同意《使用条款》</el-button>
      </div>
      <div class="ik-msg" style="text-align:center;margin-top:10px">{{ msg }}</div>
    </el-card>

    <el-dialog v-model="show" title="使用条款与免责声明" width="720px"
               top="6vh" align-center destroy-on-close>
      <pre class="ik-pre" style="max-height:60vh">{{ text }}</pre>
      <template #footer>
        <span class="ik-mut" style="float:left;line-height:32px;font-size:12px">{{ hint }}</span>
        <el-button @click="show = false">取消</el-button>
        <el-button type="primary" :disabled="!text" :loading="busy" @click="agree">同意并启用</el-button>
      </template>
    </el-dialog>
  </div>
</script>

<div id="app"></div>

<script src="./ikui.js"></script>
<script>
IKUI.mount('#app', {
  tpl: '#tpl',
  func: 'ikguard',
  data: function () {
    return {
      show: false, text: '', busy: false, msg: '',
      hint: '请完整阅读后点击「同意并启用」'
    };
  },
  methods: {
    openDlg: function () {
      var self = this;
      this.show = true;
      this.text = '';
      this.hint = '正在加载条款…';
      this.ik('show', { TYPE: 'eula' }).then(function (d) {
        var e = (d && d.eula) ? d.eula : {};
        self.text = e.text || '（条款内容缺失）';
        self.hint = '请完整阅读后点击「同意并启用」';
      }).catch(function (err) {
        self.text = '条款加载失败：' + err.message;
        self.hint = '加载失败';
      });
    },
    agree: function () {
      var self = this;
      this.busy = true;
      this.ik('eula', { op: 'accept' }).then(function () {
        self.msg = '已同意，正在启用插件功能…';
        self.show = false;
        setTimeout(function () {
          try { window.parent.location.reload(); } catch (e) { location.reload(); }
        }, 800);
      }).catch(function (e) {
        IKUI.toast('保存失败：' + e.message, 'error');
      }).then(function () { self.busy = false; });
    }
  }
});
</script>
</body>
</html>
