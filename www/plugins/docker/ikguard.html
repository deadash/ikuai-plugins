<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>安全防护控制台 ikguard</title>
<style>
  :root { --bd:#e4e7ed; --fg:#303133; --mut:#909399; --pri:#409eff; --ok:#67c23a; --warn:#e6a23c; --err:#f56c6c; --bg:#f5f7fa; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px; font:13px/1.6 "Microsoft YaHei",Helvetica,Arial,sans-serif; color:var(--fg); background:#fff; }
  h3 { margin:0 0 10px; font-size:15px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  .card { flex:1 1 150px; min-width:140px; border:1px solid var(--bd); border-radius:6px; padding:10px 12px; background:var(--bg); }
  .card .k { color:var(--mut); font-size:12px; }
  .card .v { font-size:16px; font-weight:700; margin-top:2px; word-break:break-all; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); }
  .tabs { display:flex; gap:6px; margin:16px 0 10px; border-bottom:1px solid var(--bd); }
  .tabs a { padding:6px 14px; cursor:pointer; border:1px solid transparent; border-bottom:none; border-radius:5px 5px 0 0; color:var(--fg); text-decoration:none; }
  .tabs a.on { border-color:var(--bd); background:var(--bg); color:var(--pri); font-weight:700; }
  .pane { display:none; } .pane.on { display:block; }
  table { width:100%; border-collapse:collapse; }
  th,td { border-bottom:1px solid var(--bd); padding:6px 8px; text-align:left; font-size:12px; }
  th { background:var(--bg); color:var(--mut); font-weight:400; }
  pre { margin:0; padding:10px; background:#1e1e1e; color:#d4d4d4; border-radius:5px; max-height:320px; overflow:auto; font:12px/1.5 Consolas,Monaco,monospace; white-space:pre-wrap; word-break:break-all; }
  .sw { display:flex; align-items:center; justify-content:space-between; border:1px solid var(--bd); border-radius:5px; padding:8px 12px; margin-bottom:8px; }
  .sw small { color:var(--mut); display:block; font-weight:400; }
  button { cursor:pointer; border:1px solid var(--bd); background:#fff; border-radius:4px; padding:5px 12px; font-size:12px; }
  button:hover { border-color:var(--pri); color:var(--pri); }
  button.pri { background:var(--pri); border-color:var(--pri); color:#fff; }
  .bar { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .msg { min-height:18px; font-size:12px; color:var(--mut); }
  .tag { display:inline-block; padding:1px 7px; border-radius:9px; font-size:11px; background:var(--bd); color:#fff; }
</style>
</head>
<body>
<div class="bar">
  <h3 style="margin:0">安全防护控制台</h3>
  <span class="tag">ikguard</span>
  <span style="flex:1"></span>
  <span class="msg" id="msg"></span>
  <button onclick="load()">刷新</button>
</div>

<div class="row" id="cards"></div>

<div class="tabs">
  <a class="on" data-p="p-status">开关配置</a>
  <a data-p="p-plugin">插件管理</a>
  <a data-p="p-log">审计日志</a>
  <a data-p="p-tool">工具</a>
</div>

<div class="pane on" id="p-status">
  <p style="color:#909399">开关保存在 <code>/etc/mnt/boot_args</code>，修改后立即生效并在下次开机继续生效。</p>
  <div id="switches"></div>
  <button class="pri" onclick="act('apply')">重新应用后门阻断 + 审计</button>
</div>

<div class="pane" id="p-plugin">
  <div style="margin-bottom:8px">
    <button class="pri" onclick="act('plugin',{op:'scan'})">扫描并安装 plugins/*.zip</button>
    <button onclick="act('plugin',{op:'list'})">列出插件(命令行)</button>
  </div>
  <table><thead><tr><th>名称</th><th>版本</th><th>安装时间</th><th>文件数</th><th>操作</th></tr></thead>
  <tbody id="plugin-rows"><tr><td colspan="5" style="color:#909399">暂无已安装插件</td></tr></tbody></table>
  <p style="color:#909399">待安装 zip：<span id="pending">无</span>（把插件包上传到 <code>/etc/mnt/plugins/</code> 后点"扫描并安装"）</p>
</div>

<div class="pane" id="p-log">
  <div style="margin-bottom:8px">
    <button onclick="loadLogs()">刷新日志</button>
    <button onclick="act('logclear')">清空审计日志</button>
  </div>
  <h4>体检报告 /etc/log/ikguard/report.txt</h4><pre id="log-report">-</pre>
  <h4>审计事件 audit-*.log</h4><pre id="log-audit">-</pre>
  <h4>DNS 查询 dns-*.log</h4><pre id="log-dns">-</pre>
  <h4>进程快照 proc-*.log</h4><pre id="log-proc">-</pre>
  <h4>出向连接 conn-*.log</h4><pre id="log-conn">-</pre>
  <h4>开机日志 boot.log</h4><pre id="log-boot">-</pre>
</div>

<div class="pane" id="p-tool">
  <div style="margin-bottom:8px">
    <button class="pri" onclick="act('probe')">云端连通性自检</button>
    <button onclick="act('dns',{op:'start'})">启动 DNS 记录</button>
    <button onclick="act('dns',{op:'stop'})">停止 DNS 记录</button>
  </div>
  <pre id="tool-out">-</pre>
</div>

<script>
var FLAGS = [
  ['backdoor','后门阻断','阻断/删除爱快云端后门与更新通道(不影响路由/DHCP/NAT)'],
  ['backdoor_hosts','后门 DNS 屏蔽','把云端域名写入 /etc/hosts 指向 0.0.0.0(可选加固)'],
  ['audit','审计取证','记录进程启动/DNS 请求/网络连接/封锁命中'],
  ['sshd','SSH 登录','把控制台账号的 shell 换成 bash, 便于 SSH 维护'],
  ['plugins','插件系统','开机自动铺开 /etc/mnt/plugins 下的插件'],
  ['plugins_verify','插件强校验','要求插件包必须带有效签名'],
  ['cron','定时任务','铺开 /etc/mnt/cron.d 下的 crontab'],
  ['shell','程序安装','链接 /etc/mnt/shells 下的程序与配置'],
  ['remote','远程维护','iKuai 云端远程维护通道(默认关闭)']
];

function api(action, param) {
  var body = { func_name:'ikguard', action:action, param:param||{} };
  return fetch('/Action/call', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  }).then(function(r){ return r.json(); }).then(function(j){
    if (j.Result !== 30000) { throw new Error(j.ErrMsg || ('错误码 '+j.Result)); }
    return j.Data || {};
  });
}

function tip(t, cls) {
  var m = document.getElementById('msg');
  m.textContent = t || ''; m.className = cls || 'msg';
  if (t) { setTimeout(function(){ if (m.textContent===t) m.textContent=''; }, 6000); }
}

function card(k, v, cls) {
  return '<div class="card"><div class="k">'+k+'</div><div class="v '+(cls||'')+'">'+v+'</div></div>';
}

function load() {
  return api('show', {TYPE:'data,flags,plugins'}).then(function(d){
    var s = d.status || {}, f = d.flags || {};
    var alive = (s.backdoor_alive||'').trim();
    var html = '';
    html += card('框架版本', s.version || '-');
    html += card('签名校验', s.plugins_ok==='1' ? '通过' : '未通过', s.plugins_ok==='1'?'ok':'err');
    html += card('后门进程', alive ? alive : '无', alive ? 'err':'ok');
    html += card('ipset 封锁', (s.ipset||0)+' 条', (s.ipset>0)?'ok':'warn');
    html += card('封锁规则', (s.rules||0)+' 条', (s.rules>0)?'ok':'warn');
    html += card('封锁命中', (s.blocked_hits||0)+' 包', (s.blocked_hits>0)?'warn':'ok');
    html += card('DNS 记录', s.dns_running==1?'运行中':'未运行', s.dns_running==1?'ok':'warn');
    html += card('日志分区', (s.log_usage||'-'));
    document.getElementById('cards').innerHTML = html;

    var sw = '';
    FLAGS.forEach(function(it){
      var on = (String(f[it[0]]) === '1');
      sw += '<div class="sw"><div><b>'+it[1]+'</b> <code>'+it[0]+'</code><small>'+it[2]+'</small></div>';
      sw += '<button class="'+(on?'pri':'')+'" onclick="setFlag(\''+it[0]+'\','+(on?'0':'1')+')">'+(on?'已开启':'已关闭')+'</button></div>';
    });
    document.getElementById('switches').innerHTML = sw;

    var rows = '';
    (d.plugins||[]).forEach(function(p){
      rows += '<tr><td>'+p.name+'</td><td>'+(p.version||'-')+'</td><td>'+(p.state||'-')+'</td><td>'+p.files+'</td>'
           +  '<td><button onclick="act(\'plugin\',{op:\'remove\',name:\''+p.name+'\'})">卸载</button></td></tr>';
    });
    document.getElementById('plugin-rows').innerHTML = rows || '<tr><td colspan="5" style="color:#909399">暂无已安装插件</td></tr>';
    document.getElementById('pending').textContent = (d.pending||[]).map(function(z){return z.name;}).join(' , ') || '无';
  }).catch(function(e){ tip('加载失败: '+e.message, 'msg err'); });
}

function loadLogs() {
  return api('show', {TYPE:'logs'}).then(function(d){
    var l = d.logs || {};
    ['report','audit','dns','proc','conn','boot'].forEach(function(k){
      var el = document.getElementById('log-'+k);
      if (el) { el.textContent = l[k] || '(空)'; }
    });
  }).catch(function(e){ tip('日志加载失败: '+e.message, 'msg err'); });
}

function setFlag(key, value) {
  api('seting', {key:key, value:String(value)}).then(function(){
    tip(key+' = '+value+' 已生效', 'msg ok'); load();
  }).catch(function(e){ tip('设置失败: '+e.message, 'msg err'); });
}

function act(action, param) {
  api(action, param).then(function(j){
    tip('操作成功', 'msg ok');
    if (action === 'probe' || action === 'plugin') {
      document.getElementById('tool-out').textContent = JSON.stringify(j);
    }
    load(); loadLogs();
  }).catch(function(e){ tip('操作失败: '+e.message, 'msg err'); });
}

document.querySelectorAll('.tabs a').forEach(function(a){
  a.onclick = function(){
    document.querySelectorAll('.tabs a').forEach(function(x){ x.classList.remove('on'); });
    document.querySelectorAll('.pane').forEach(function(x){ x.classList.remove('on'); });
    a.classList.add('on');
    document.getElementById(a.dataset.p).classList.add('on');
    if (a.dataset.p === 'p-log') loadLogs();
  };
});

load();
setInterval(function(){ if (!document.hidden) load(); }, 15000);
</script>
</body>
</html>
