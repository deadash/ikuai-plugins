<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>插件模板 plugdemo</title>
<!--
  界面用插件统一 UI 套件 ikui（Element Plus + 设计令牌）。
  ikui.js / ikui.css 由**基础包**提供（开机软链到 /plugins/app/），
  插件不用带任何 UI 资源；本页跟它在同一目录，所以是 ./ikui.js。
  详细用法见 <skill>/assets/ui/README.md —— 写页面之前先看它。
-->
<link rel="stylesheet" href="./ikui.css">
</head>
<body>

<!--
  模板必须放 <script type="text/x-template"> 里：HTML 解析器不认自闭合标签，
  写在 body 里的话 <el-table-column/> 会把后面的列全吞进去（表格塌成一列）。
-->
<script type="text/x-template" id="tpl">
<ik-page title="插件模板" tag="plugdemo">
  <template #actions>
    <span class="ik-msg">{{ msg }}</span>
    <el-button size="small" @click="load">刷新</el-button>
  </template>

  <ik-tiles :items="tiles"></ik-tiles>

  <ik-sec title="配置">
    <el-form label-width="110px" @submit.prevent>
      <el-form-item label="采集间隔">
        <el-input v-model="interval" style="width:160px">
          <template #append>秒</template>
        </el-input>
        <el-button type="primary" style="margin-left:10px" @click="setk('interval', interval)">保存间隔</el-button>
      </el-form-item>
      <el-form-item label="备注">
        <el-input v-model="note" style="width:260px"></el-input>
        <el-button style="margin-left:10px" @click="setk('note', note)">保存备注</el-button>
      </el-form-item>
    </el-form>
  </ik-sec>

  <ik-sec title="操作">
    <div class="ik-toolbar">
      <el-button @click="act('sample')">立即采集</el-button>
      <el-button @click="act('report')">LuaJIT 统计报告</el-button>
      <el-button type="danger" plain @click="act('clear')">清空采样</el-button>
    </div>
    <p class="ik-tip">
      数据存放在持久分区 <code class="ik-code">/etc/mnt/plugins/plugdemo/data/plugdemo.db</code>(sqlite3)，
      重启不丢；采集进程由 <code class="ik-code">boot.sh</code> 每次开机重新拉起。
    </p>
  </ik-sec>

  <ik-sec title="输出">
    <pre class="ik-pre">{{ out || '点上面的按钮查看结果…' }}</pre>
  </ik-sec>
</ik-page>
</script>

<div id="app"></div>

<script src="./ikui.js"></script>
<script>
IKUI.mount('#app', {
  tpl: '#tpl',
  func: 'plugdemo',
  data: function () {
    return { msg: '', tiles: [], interval: '', note: '', out: '' };
  },
  methods: {
    pick: function (d, key) { return (d && d[key]) || (d && d.data && d.data[key]) || null; },
    load: function () {
      var self = this;
      return this.ik('show', { TYPE: 'data' }).then(function (d) {
        var s = self.pick(d, 'status') || {};
        var run = s.daemon_running === true || s.daemon_running === 'true';
        self.tiles = [
          { k: '采集进程', v: run ? '运行中' : '未运行', tone: run ? 'ok' : 'err' },
          { k: '采样条数', v: s.samples || 0 },
          { k: '间隔(秒)', v: s.interval || '-' },
          { k: '数据库大小', v: (s.db_size || 0) + ' B', size: 'sm' }
        ];
        if (document.activeElement !== self.$el) { /* 保持用户正在编辑的值 */ }
        self.interval = s.interval || '';
        self.note = s.note || '';
      }).catch(function (e) { self.msg = e.message; });
    },
    setk: function (k, v) {
      var self = this;
      /* 参数值不能带空格，框架侧 lua 会拦；自由文本用 + 传，后端 tr '+' ' ' 还原 */
      this.ik('seting', { key: k, value: String(v).replace(/ /g, '+') }).then(function () {
        IKUI.toast('已保存', 'success'); self.load();
      }).catch(function (e) { IKUI.toast('保存失败: ' + e.message, 'error'); });
    },
    act: function (action) {
      var self = this;
      this.out = '执行中…';
      this.ik(action, {}).then(function (d) {
        self.out = JSON.stringify(self.pick(d, action) || d, null, 2);
        IKUI.toast('已执行', 'success'); self.load();
      }).catch(function (e) { self.out = '失败: ' + e.message; IKUI.toast('操作失败: ' + e.message, 'error'); });
    }
  },
  mounted: function () {
    var self = this;
    this.load();
    this.timer = setInterval(function () { if (!document.hidden) { self.load(); } }, 30000);
  },
  unmounted: function () { if (this.timer) { clearInterval(this.timer); } }
});
</script>
</body>
</html>
